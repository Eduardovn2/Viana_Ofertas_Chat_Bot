name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ofertas-bot
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ofertas_ci_test
          POSTGRES_USER: ofertas_ci
          POSTGRES_PASSWORD: ofertas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ofertas_ci -d ofertas_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      # Banco descartável do CI; nenhuma credencial real é usada nos testes.
      TEST_DATABASE_URL: postgresql+psycopg://ofertas_ci:ofertas_ci@127.0.0.1:5432/ofertas_ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: uv sync --extra dev
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Testes (offline + PostgreSQL)
        run: uv run pytest -q
